
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: delivery-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Native processes connect through localhost:9092; Compose services use
      # the separate internal listener.  Kafka must advertise an address that
      # is resolvable from the client that connected to it.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: delivery-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-tracking-app
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-driver-locations}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-location-writer}
      NUM_DRIVERS: ${NUM_DRIVERS:-20}
      HEARTBEAT_TTL_SEC: ${HEARTBEAT_TTL_SEC:-15}
    restart: unless-stopped
