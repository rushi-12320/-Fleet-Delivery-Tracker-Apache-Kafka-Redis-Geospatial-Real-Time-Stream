# ====================================================================
# Render Infrastructure as Code Blueprint (render.yaml)
# Deploy 100% Free on Render: https://dashboard.render.com/blueprints
# ====================================================================
services:
  - type: web
    name: delivery-tracking-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python api.py
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: true
      - key: NUM_DRIVERS
        value: 20
